name: Faraz Sanat CI Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # تنظیم دقیق pnpm به همراه غیرفعال کردن بررسی سن انتشار پکیج‌ها در سطح سرور
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11
        run_install: false # 👈 این خط بسیار حیاتی است؛ جلوی نصب اتوماتیک و کرش کردن پلاک‌این را می‌گیرد

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    # حالا خودمان به صورت دستی و با فلگ‌های امنیتی دانلود را کنترل می‌کنیم
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile --config.minimum-release-age=0

    - name: Build Project
      run: pnpm build

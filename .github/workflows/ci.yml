name: Faraz Sanat CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # استفاده از نسخه پایدار و رسمی اکشن pnpm
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11 # هماهنگ با pnpm v11 شما

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    # افزودن flag برای نصب نرم‌تر پکیج‌ها در محیط CI
    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile --config.minimum-release-age=0

    - name: Build Project
      run: pnpm build
